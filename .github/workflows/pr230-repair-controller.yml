name: PR230 repair controller

on:
  push:
    branches:
      - tmp/pr230-repair-controller-20260904
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_BRANCH: feat/222-evidence-bound-visual-refresh-v1
      WORKER_BRANCH: tmp/pr230-github-models-fix-20260904
      KNOWN_COMMENT_ID: "5538090011"
    steps:
      - name: Wait for worker and retry once when needed
        run: |
          set -euo pipefail
          worker='PR230 autonomous review fixes'

          latest_run() {
            gh run list --repo "$REPO" --workflow "$worker" --branch "$WORKER_BRANCH" --limit 1 \
              --json databaseId,status,conclusion,url,headSha --jq '.[0] // {}'
          }

          wait_run() {
            local attempts=0
            while (( attempts < 120 )); do
              data=$(latest_run)
              status=$(jq -r '.status // "missing"' <<<"$data")
              if [[ "$status" == "completed" ]]; then
                printf '%s' "$data"
                return 0
              fi
              sleep 20
              attempts=$((attempts+1))
            done
            return 1
          }

          data=$(wait_run || true)
          if [[ -z "$data" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$KNOWN_COMMENT_ID" \
              -f body='PR #230 후속 수정 worker 상태: timeout — target branch에는 검증되지 않은 변경을 push하지 않았습니다.'
            exit 1
          fi

          conclusion=$(jq -r '.conclusion // ""' <<<"$data")
          run_id=$(jq -r '.databaseId // ""' <<<"$data")
          run_url=$(jq -r '.url // ""' <<<"$data")

          if [[ "$conclusion" != "success" ]]; then
            gh run rerun "$run_id" --repo "$REPO" --failed || gh run rerun "$run_id" --repo "$REPO"
            sleep 20
            data=$(wait_run || true)
            conclusion=$(jq -r '.conclusion // ""' <<<"$data")
            run_id=$(jq -r '.databaseId // ""' <<<"$data")
            run_url=$(jq -r '.url // ""' <<<"$data")
          fi

          if [[ "$conclusion" != "success" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$KNOWN_COMMENT_ID" \
              -f body="PR #230 후속 수정 worker 상태: failure — target branch에는 검증되지 않은 변경을 push하지 않았습니다. Run: $run_url"
            exit 1
          fi

          head=$(gh api "repos/$REPO/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')
          subject=$(gh api "repos/$REPO/commits/$head" --jq '.commit.message' | head -1)
          if [[ "$subject" != 'fix(visual-refresh): wire shipped workflow authority boundaries' ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$KNOWN_COMMENT_ID" \
              -f body="PR #230 worker는 성공으로 종료했지만 target HEAD가 예상 커밋이 아닙니다: $head ($subject). 수동 확인 필요. Run: $run_url"
            exit 1
          fi

          # Wait for the standard PR workflow attached to the new target SHA.
          ci_url=''
          for _ in $(seq 1 120); do
            ci=$(gh run list --repo "$REPO" --workflow frontend-workflow-kit --branch "$TARGET_BRANCH" --commit "$head" --limit 1 \
              --json databaseId,status,conclusion,url --jq '.[0] // {}')
            ci_status=$(jq -r '.status // "missing"' <<<"$ci")
            ci_conclusion=$(jq -r '.conclusion // ""' <<<"$ci")
            ci_url=$(jq -r '.url // ""' <<<"$ci")
            if [[ "$ci_status" == "completed" ]]; then
              break
            fi
            sleep 20
          done

          if [[ "$ci_conclusion" != "success" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$KNOWN_COMMENT_ID" \
              -f body="PR #230 후속 수정은 $head 에 push됐지만 최종 표준 CI가 성공하지 않았습니다. Worker: $run_url / CI: $ci_url"
            exit 1
          fi

          gh api --method PATCH "repos/$REPO/issues/comments/$KNOWN_COMMENT_ID" \
            -f body="PR #230 후속 수정 완료 및 검증 성공. HEAD: $head. Worker focused/spec/full/diffcheck 성공: $run_url. 최종 표준 frontend-workflow-kit CI 성공: $ci_url."
