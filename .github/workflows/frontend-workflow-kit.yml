name: frontend-workflow-kit

# MVP-A 게이트: 킷이 자기 golden example(coupon-feature)을 CI 에서 계속 검증한다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-workflow-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-workflow-kit/package-lock.json

      - run: npm ci

      # Reproducible source and lockfile-installed dependencies for offline CLI verification.
      # No credentials, .git configuration, or new required status is exported.
      - name: archive verification source (advisory)
        continue-on-error: true
        run: |
          git -C "$GITHUB_WORKSPACE" archive --format=tar --prefix=repository/ HEAD > "$RUNNER_TEMP/workflow-verification-source.tar"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/workflow-verification-source.txt"
          tar -C "$GITHUB_WORKSPACE/frontend-workflow-kit" -cf "$RUNNER_TEMP/workflow-verification-dependencies.tar" node_modules

      - name: upload verification source (advisory)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workflow-verification-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/workflow-verification-source.tar
            ${{ runner.temp }}/workflow-verification-source.txt
            ${{ runner.temp }}/workflow-verification-dependencies.tar
          retention-days: 3

      - name: lint-pack generated config drift (warning-only)
        continue-on-error: true
        run: npm run workflow:lint-gen -- --check

      - name: lint-pack ratchet baseline (warning-only)
        continue-on-error: true
        run: npm run workflow:lint-baseline -- --json

      - run: npm run example:state
      - run: npm run example:readiness

      - name: telemetry observation ledger (warning-only)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-workflow-telemetry"

          set +e
          npm --silent run workflow:telemetry -- \
            --docs examples/coupon-feature/docs/frontend-workflow \
            --out "$RUNNER_TEMP/frontend-workflow-telemetry/telemetry-ledger.json"
          ledger_status=$?

          npm --silent run workflow:telemetry -- \
            --docs examples/coupon-feature/docs/frontend-workflow \
            --json > "$RUNNER_TEMP/frontend-workflow-telemetry/telemetry-report.json"
          report_status=$?

          if [ "$ledger_status" -ne 0 ]; then
            echo "::warning::telemetry ledger collection exited with status $ledger_status"
          fi
          if [ "$report_status" -ne 0 ]; then
            echo "::warning::telemetry report collection exited with status $report_status"
          fi
          exit 0

      - name: summarize telemetry artifact files (warning-only)
        if: always()
        continue-on-error: true
        run: |
          for file in \
            "$RUNNER_TEMP/frontend-workflow-telemetry/telemetry-ledger.json" \
            "$RUNNER_TEMP/frontend-workflow-telemetry/telemetry-report.json"
          do
            if [ ! -s "$file" ]; then
              echo "::warning::telemetry artifact file is missing or empty: $file"
            else
              wc -c "$file"
            fi
          done

      - name: upload telemetry observation artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-workflow-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frontend-workflow-telemetry/telemetry-ledger.json
            ${{ runner.temp }}/frontend-workflow-telemetry/telemetry-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: assert generated docs match committed (idempotency)
        run: |
          if ! git diff --exit-code -- examples/coupon-feature/docs/frontend-workflow/_meta; then
            echo "::error::생성기 출력이 커밋된 _meta 산출물과 다릅니다. 'npm run example:state' 후 변경분을 커밋하세요."
            exit 1
          fi

      - run: npm run example:validate
      - run: npm run test:spec

      - name: golden fixture regression (warning-only)
        continue-on-error: true
        run: npm run example:test

  compat-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-workflow-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-workflow-kit/package-lock.json
      - run: npm ci
      - run: npm run test:spec
      - run: npm run example:validate

  macos-smoke:
    # Case-only declarations must be exercised on a case-insensitive filesystem.
    # Include raw Git path/bytes/modes alongside large JSON and cross-root audit.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend-workflow-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-workflow-kit/package-lock.json
      - run: npm ci
      - run: node --test scripts/lib/util.test.mjs scripts/lib/distribution.test.mjs scripts/lib/upgrade-planner.test.mjs scripts/lib/visual-refresh-followup.test.mjs scripts/lib/visual-refresh-orchestration.test.mjs scripts/lib/visual-refresh-internal-boundaries.test.mjs scripts/lib/visual-refresh-git-snapshot.test.mjs
      - run: npm run example:validate
