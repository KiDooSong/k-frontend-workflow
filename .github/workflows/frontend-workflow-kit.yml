name: frontend-workflow-kit

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-pr217-review-fixes:
    if: >-
      github.event.pull_request.number == 217 &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-202c-reconciliation-warnings
          fetch-depth: 0
      - name: Apply reviewed precision/evidence corrections and remove transfer machinery
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/assert.ok(duplicateSummary.errors.length > 0);/d" .codex/apply-pr217-review-fixes.py
          python3 .codex/apply-pr217-review-fixes.py
          git diff --check
          (
            cd frontend-workflow-kit
            npm ci
            node --test scripts/lib/reconciliation-warnings.test.mjs scripts/lib/reconciliation-items.test.mjs
          )
          git fetch origin main
          git checkout origin/main -- .github/workflows/frontend-workflow-kit.yml
          git rm -f .github/workflows/codex-pr217-doc-fixes.yml
          git rm -r -f .codex
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation): address semantic warning review findings"
          git push origin "HEAD:codex/issue-202c-reconciliation-warnings"
