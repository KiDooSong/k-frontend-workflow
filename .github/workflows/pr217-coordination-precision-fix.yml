name: pr217-coordination-precision-fix

on:
  push:
    branches:
      - codex/issue-202c-reconciliation-warnings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-202c-reconciliation-warnings
          fetch-depth: 0

      - name: Apply coordination-boundary and epistemic precision fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.codex/pr217-coordination-fix.py')
          text = path.read_text(encoding='utf-8')
          old = """  `cannot both`다. 질문·불확실성·명시적 부정은 marker가 놓인 local clause에서 판정하므로, 다른 clause의
            unrelated negation은 실제 affirmative marker를 숨기지 않는다. `different`/`mismatch`/`vs`/`불일치` 같은
            약한 표현은 억제한다."""
          new = """  `cannot both`다. 질문·가정·불확실성·명시적 부정은 marker가 놓인 local clause에서 판정하므로 다른 clause의
            unrelated negation/modality는 실제 affirmative marker를 숨기지 않는다. `different`/`mismatch`/`vs`/`불일치` 같은
            약한 표현은 억제한다."""
          if text.count(old) != 1:
              raise SystemExit(f'expected one canonical applicator literal, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .codex/pr217-coordination-fix.py
          git diff --check
          (
            cd frontend-workflow-kit
            npm ci
            node --test scripts/lib/reconciliation-warnings.test.mjs scripts/lib/reconciliation-items.test.mjs
          )
          git rm -f .github/workflows/pr217-coordination-precision-fix.yml
          git rm -r -f .codex
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation): isolate coordinated route relations"
          git push origin "HEAD:codex/issue-202c-reconciliation-warnings"
