              """test('canonical input extraction reuses the exact input contract and rejects path/suffix lookalikes', () => {""",
              """test('RR-ROUTE-101 isolates high-confidence coordination boundaries without breaking direct conjunctions', () => {
  for (const evidenceText of [
    `${OTHER_INPUT_ID}은 현재 정책과 동일하고, 별도 UI 옵션 두 개는 서로 충돌한다.`,
    `${OTHER_INPUT_ID}를 참고하며 별도 UI 옵션 두 개는 서로 충돌한다.`,
    `${OTHER_INPUT_ID} is compatible with the current policy, while the two local UI options conflict.`,
    `${OTHER_INPUT_ID} is compatible, whereas the local cache options conflict.`,
    `${OTHER_INPUT_ID} is compatible, although the local cache options conflict.`,
    `${OTHER_INPUT_ID} is compatible, though the local cache options conflict.`,
    `${OTHER_INPUT_ID}은 현재 정책과 동일하다. 한편 별도 UI 옵션 두 개는 서로 충돌한다.`,
    `${OTHER_INPUT_ID}은 현재 정책과 동일하다. 반대로 별도 UI 옵션 두 개는 서로 충돌한다.`,
    `${OTHER_INPUT_ID}은 현재 정책과 동일하다. 그와 별개로 별도 UI 옵션 두 개는 서로 충돌한다.`,
  ]) {
    assert.equal(routeWarnings({ evidenceText }).length, 0, evidenceText);
  }

  assert.equal(
    routeWarnings({
      evidenceText: `${OTHER_INPUT_ID} and ${THIRD_INPUT_ID} conflict.`,
      extraArtifacts: [inputArtifact(THIRD_INPUT_ID, ['unique third input'])],
    }).length,
    1,
  );
  assert.equal(
    routeWarnings({ evidenceText: `기존 ${OTHER_INPUT_ID} 정책과 충돌한다.` }).length,
    1,
  );
});

test('canonical input extraction reuses the exact input contract and rejects path/suffix lookalikes', () => {""",
          )

          replace_once(
              integration_tests,
              """    ['- IN-20260720-figma-001 conflicts with this captured meeting policy.'],
    ['- IN-20260720-figma-001 and IN-20260720-meeting-001 are mutually exclusive.'],""",
              """    ['- IN-20260720-figma-001 conflicts with this captured meeting policy.'],
    ['- IN-20260720-figma-001 and IN-20260720-meeting-001 are mutually exclusive.'],
    ['- IN-20260720-figma-001 and IN-20260720-meeting-001 conflict.'],""",
          )

          replace_once(
              integration_tests,
              """    ['- IN-20260720-figma-001을 참고한다; 로컬 캐시와 서버 캐시는 서로 모순이다.'],
    ['- `IN-20260720-figma-001 충돌`은 코드 예시다.'],""",
              """    ['- IN-20260720-figma-001을 참고한다; 로컬 캐시와 서버 캐시는 서로 모순이다.'],
    ['- IN-20260720-figma-001은 현재 정책과 동일하고, 별도 UI 옵션 두 개는 서로 충돌한다.'],
    ['- IN-20260720-figma-001을 참고하며 별도 UI 옵션 두 개는 서로 충돌한다.'],
    ['- IN-20260720-figma-001 is compatible with the current policy, while the two local UI options conflict.'],
    ['- IN-20260720-figma-001 is compatible, whereas the local cache options conflict.'],
    ['- IN-20260720-figma-001와 충돌한다는 근거는 없다.'],
    ['- IN-20260720-figma-001와 충돌할 수도 있다.'],
    ['- IN-20260720-figma-001와 충돌한다고 볼 수 없다.'],
    ['- IN-20260720-figma-001는 충돌이 아닌 것으로 보인다.'],
    ['- There is no evidence that IN-20260720-figma-001 conflicts with this input.'],
    ['- It is unclear if IN-20260720-figma-001 conflicts with this input.'],
    ['- IN-20260720-figma-001 probably conflicts with this input.'],
    ['- IN-20260720-figma-001 is unlikely to conflict with this input.'],
    ['- `IN-20260720-figma-001 충돌`은 코드 예시다.'],""",
          )

          replace_once(
              canonical,
              """  `cannot both`다. 질문·불확실성·명시적 부정은 marker가 놓인 local clause에서 판정하므로, 다른 clause의
  unrelated negation은 실제 affirmative marker를 숨기지 않는다. `different`/`mismatch`/`vs`/`불일치` 같은
  약한 표현은 억제한다.""",
              """  `cannot both`다. marker와 explicit other input ID는 같은 high-confidence relation clause에 있어야 한다.
  sentence/semicolon 외에도 `, while|whereas|although|though`, `한편|반대로|그와 별개로`,
  `동일하고,`/`참고하며` 같은 중립 서술 연결형을 경계로 보되 plain `and`/`와`는 관계 내부에 유지한다.
  질문·증거 부재·가정·불확실성·추정·명시적 부정은 marker가 놓인 local clause에서 판정하므로, 다른 clause의
  unrelated polarity는 실제 affirmative marker를 숨기지 않는다. `different`/`mismatch`/`vs`/`불일치` 같은
