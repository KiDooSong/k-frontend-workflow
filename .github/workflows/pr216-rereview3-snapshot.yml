name: pr216-rereview3-snapshot

on:
  push:
    branches:
      - agent/pr216-rereview3-snapshot-20260803

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr216-rereview3-snapshot-20260803
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-workflow-kit/package-lock.json
      - name: Install dependencies
        working-directory: frontend-workflow-kit
        run: npm ci
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr216-rereview3-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
          include-hidden-files: true
          retention-days: 1
