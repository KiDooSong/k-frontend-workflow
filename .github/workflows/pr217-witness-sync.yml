name: pr217-witness-sync

on:
  push:
    branches:
      - codex/issue-202c-reconciliation-warnings

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-202c-reconciliation-warnings
          fetch-depth: 0

      - name: Synchronize dogfood implementation witness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          implementation = '3de27895de4eadaed64329e115dccc9b40b96c48'

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, got {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'kit-dev/temp/runs/issue-202-reconciliation-dogfood-001.md',
              '> current clause-coupled route-precision implementation/tests witness: `b1624bcd4fab8e291b99176afba3f2a11a00a6f4`\n> reviewed implementation HEAD: `b1624bcd4fab8e291b99176afba3f2a11a00a6f4` (subsequent evidence-metadata-only commits do not alter analyzer/tests)',
              '> prior clause-coupled route-precision witness: `b1624bcd4fab8e291b99176afba3f2a11a00a6f4`\n> current coordination-boundary/epistemic precision implementation/tests witness: `' + implementation + '`\n> reviewed implementation HEAD: `' + implementation + '` (subsequent evidence-metadata-only commits do not alter analyzer/tests)',
          )
          replace_once(
              'kit-dev/temp/runs/issue-202-reconciliation-dogfood-001/README.md',
              '- current clause-coupled route-precision implementation/tests witness: `b1624bcd4fab8e291b99176afba3f2a11a00a6f4`\n- reviewed implementation HEAD: `b1624bcd4fab8e291b99176afba3f2a11a00a6f4`; later evidence-metadata-only commits do not alter analyzer/tests',
              '- prior clause-coupled route-precision witness: `b1624bcd4fab8e291b99176afba3f2a11a00a6f4`\n- current coordination-boundary/epistemic precision implementation/tests witness: `' + implementation + '`\n- reviewed implementation HEAD: `' + implementation + '`; later evidence-metadata-only commits do not alter analyzer/tests',
          )
          PY
          git diff --check
          git rm -f .github/workflows/pr217-witness-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(dogfood): record coordination precision witness"
          git push origin "HEAD:codex/issue-202c-reconciliation-warnings"
