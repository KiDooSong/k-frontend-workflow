name: pr217-structured-witness-sync

on:
  push:
    branches:
      - codex/issue-202c-reconciliation-warnings

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-202c-reconciliation-warnings
          fetch-depth: 0

      - name: Synchronize design and dogfood witness metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          implementation = 'fae71c31c136349a0e15a8425e1992a44906dcbc'

          design = Path('kit-dev/docs/design/drafts/issue-202-reconciliation-contract-v2.md')
          text = design.read_text(encoding='utf-8')
          pattern = (
              r'  canonical-looking ID 하나라도 missing/duplicate이면 fail-closed하고, marker 후보와 explicit other input ID는 같은\n'
              r'  high-confidence relation clause에 있어야 한다\..*?\n'
              r'  부정을 clause-local로 판정한다\.'
          )
          replacement = '\n'.join([
              '  canonical-looking ID 하나라도 missing/duplicate이면 fail-closed하고, marker 후보와 explicit other input ID는 같은',
              '  high-confidence relation clause에 있어야 한다. 자연어 분석 전 canonical/noncanonical `IN-*` identifier와',
              '  URL·path·URI·key=value·filename structured token span을 same-length 공백으로 mask한다. marker·polarity·',
              '  coordination은 semantic view만 읽고 input 추출과 warning provenance는 원문 offset을 유지한다. 따라서 input ID source의',
              '  `conflict|while|may`, `/api/conflict`, `mode=conflict`는 자연어 marker·boundary·modality로 해석하지 않는다.',
              '  sentence/semicolon의 각 span마다 선행 `while|whereas|although|though ... ,` closing comma를 처리하고 후치·무쉼표',
              '  coordination도 경계로 본다. `, and`는 독립절이면 분리하되 canonical input serial list 뒤에 canonical input 또는',
              '  `this/current input`이 오는 관계는 보존한다. 한국어 중립 서술 coordination도 경계로 유지한다. marker 후보는 source',
              '  order로 평가하며 질문·증거 부족·가정·불확실성·추정·공통/marker별 부정을 clause-local로 판정한다.',
          ])
          text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'design precision paragraph replacement count={count}')
          design.write_text(text, encoding='utf-8')

          report = Path('kit-dev/temp/runs/issue-202-reconciliation-dogfood-001.md')
          text = report.read_text(encoding='utf-8')
          old = '\n'.join([
              '> current symmetric leading-coordination/epistemic implementation/tests witness: `9cc8ba3a368a705001c6f15cd81803cb54e477ed`',
              '> reviewed implementation HEAD: `9cc8ba3a368a705001c6f15cd81803cb54e477ed` (subsequent evidence-metadata-only commits do not alter analyzer/tests)',
          ])
          new = '\n'.join([
              '> prior symmetric leading-coordination/epistemic implementation/tests witness: `9cc8ba3a368a705001c6f15cd81803cb54e477ed`',
              f'> current structured-token semantic-view/relation-span implementation/tests witness: `{implementation}`',
              f'> reviewed implementation HEAD: `{implementation}` (subsequent documentation/metadata-only commits do not alter analyzer/tests)',
          ])
          if text.count(old) != 1:
              raise SystemExit('dogfood report witness block not found exactly once')
          report.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('kit-dev/temp/runs/issue-202-reconciliation-dogfood-001/README.md')
          text = readme.read_text(encoding='utf-8')
          old = '\n'.join([
              '- current symmetric leading-coordination/epistemic implementation/tests witness: `9cc8ba3a368a705001c6f15cd81803cb54e477ed`',
              '- report witness synchronization: `b63132ca5189edbace3ca6b8829347d196def214`',
              '- reviewed implementation HEAD: `9cc8ba3a368a705001c6f15cd81803cb54e477ed`; subsequent evidence-metadata-only commits do not alter analyzer/tests',
          ])
          new = '\n'.join([
              '- prior symmetric leading-coordination/epistemic implementation/tests witness: `9cc8ba3a368a705001c6f15cd81803cb54e477ed`',
              f'- current structured-token semantic-view/relation-span implementation/tests witness: `{implementation}`',
              '- report witness synchronization: `b63132ca5189edbace3ca6b8829347d196def214`',
              f'- reviewed implementation HEAD: `{implementation}`; subsequent documentation/metadata-only commits do not alter analyzer/tests',
          ])
          if text.count(old) != 1:
              raise SystemExit('dogfood README witness block not found exactly once')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git rm -f .github/workflows/pr217-structured-witness-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(reconciliation): document structured semantic masking"
          git push origin "HEAD:codex/issue-202c-reconciliation-warnings"
