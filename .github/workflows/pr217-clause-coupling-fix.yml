name: pr217-clause-coupling-fix

on:
  push:
    branches:
      - codex/issue-202c-reconciliation-warnings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-202c-reconciliation-warnings
          fetch-depth: 0

      - name: Apply clause-coupled precision fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.codex/pr217-clause-fix.py')
          text = path.read_text(encoding='utf-8')
          old = "re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if text.count(old) != 1:
              raise SystemExit(f'expected one subn call, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .codex/pr217-clause-fix.py
          git diff --check
          (
            cd frontend-workflow-kit
            npm ci
            node --test scripts/lib/reconciliation-warnings.test.mjs scripts/lib/reconciliation-items.test.mjs
          )
          git rm .github/workflows/pr217-clause-coupling-fix.yml
          git rm -r .codex
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reconciliation): couple route evidence to marker clause"
          git push origin "HEAD:codex/issue-202c-reconciliation-warnings"
