    ['- `IN-20260720-figma-001 충돌`은 코드 예시다.'],""",
          )

          replace_once(
              integration,
              """  for (const facts of negatives) {
    const result = runScopeUnknown(t, facts);
    assert.equal(warningMessagesByCode(result, 'RR-ROUTE-101').length, 0, facts.join(' / '));
  }

  const sectionOnly =""",
