name: pr217-clause-coupling-fix

on:
  push:
    branches:
      - codex/issue-202c-reconciliation-warnings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-202c-reconciliation-warnings
          fetch-depth: 0

      - name: Apply clause-coupled precision fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact block, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def sub_once(path, pattern, replacement, *, flags=0):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex replacement, got {count}')
              p.write_text(updated, encoding='utf-8')

          warnings = 'frontend-workflow-kit/scripts/lib/reconciliation-warnings.mjs'
          tests = 'frontend-workflow-kit/scripts/lib/reconciliation-warnings.test.mjs'
          integration = 'frontend-workflow-kit/scripts/lib/reconciliation-items.test.mjs'
          canonical = 'frontend-workflow-kit/docs/reference/input-reconciliation.md'
          design = 'kit-dev/docs/design/drafts/issue-202-reconciliation-contract-v2.md'

          sub_once(
              warnings,
              r"const QUESTION_PATTERNS = \[\n.*?\n\];\nconst UNCERTAINTY_PATTERNS = \[\n.*?\n\];",
              r"""const QUESTION_PATTERNS = [
  /[?？]/u,
  /(?:충돌|상충|모순|양립\s*불가)\s*(?:여부|인지|하는지|하는가|되는지|되는가)/u,
  /양립할\s+수\s+없(?:는지|는가)/u,
  /\bwhether\b/iu,
  /\b(?:check|determine|verify|confirm|assess|test|find\s+out|wonder|ask|inquire|investigate)\b.{0,48}\b(?:whether|if)\b/iu,
  /^\s*(?:q(?:uestion)?\s*[:：-]\s*)?(?:are|is|do|does|did|can|could|would|should|was|were)\b/iu,
];
const UNCERTAINTY_PATTERNS = [
  /가능성/u,
  /아마/u,
  /추정/u,
  /(?:충돌|상충|모순|양립\s*불가)(?:할|일)?\s*수\s*있/u,
  /(?:충돌|상충|모순|양립\s*불가)(?:할|일)?지도\s*모른/u,
  /\b(?:possible|possibly|potentially|apparently|likely)\b/iu,
  /\b(?:may|might|would)\b/iu,
  /\b(?:can|could)\s+(?:potentially\s+)?(?:conflict|contradict)\b/iu,
  /\b(?:can|could)\s+be\s+(?:incompatible|contradictory|mutually\s+exclusive)\b/iu,
  /\b(?:appears?|seems?)\s+(?:to\s+be\s+)?(?:incompatible|contradictory|mutually\s+exclusive)\b/iu,
  /\b(?:appears?|seems?)\s+to\s+(?:conflict|contradict)\b/iu,
];
const COMMON_DENIAL_PATTERNS = [
  /\bnot\s+true\s+that\b/iu,
  /\b(?:cannot|can['’]t|could\s+not|couldn['’]t)\s+(?:say|claim|conclude|assert|determine)\s+(?:that\s+)?/iu,
  /(?:충돌|상충|모순|양립\s*불가)(?:한|한다고|이라고)?\s*것은\s*아니/u,
  /(?:충돌|상충|모순|양립\s*불가).{0,24}(?:단정|말|주장|결론).{0,16}(?:할|내릴)\s*수\s*없/u,
  /(?:충돌|상충|모순|양립\s*불가).{0,24}보기\s*어렵/u,
  /(?:서로\s+)?모순이라고\s*할\s*수\s*없/u,
];""",
              flags=re.S,
          )

          replace_once(
              warnings,
              "return { text: text.slice(left, right).trim(), start: left };",
              "return { text: text.slice(left, right).trim(), start: left, end: right };",
          )

          sub_once(
              warnings,
              r"export function matchAffirmativeConflictMarker\(value\) \{\n.*?\n\}\n\nfunction nonWhitespaceSegment",
              r"""export function findAffirmativeConflictClauses(value) {
  const text = normalizedProse(value);
  if (!text) return [];

  const occurrences = [];
  AFFIRMATIVE_CONFLICT_MARKERS.forEach((marker, markerOrder) => {
    for (const occurrence of markerOccurrences(text, marker.pattern)) {
      occurrences.push({ marker, markerOrder, ...occurrence });
    }
  });
  occurrences.sort(
    (a, b) =>
      a.index - b.index ||
      a.markerOrder - b.markerOrder ||
      stableCompare(a.text, b.text),
  );

  const candidates = [];
  for (const occurrence of occurrences) {
    const { marker } = occurrence;
    const clause = clauseAroundMarker(
      text,
      occurrence.index,
      occurrence.index + occurrence.text.length,
    );
    if (
      [...QUESTION_PATTERNS, ...UNCERTAINTY_PATTERNS, ...COMMON_DENIAL_PATTERNS]
        .some((pattern) => pattern.test(clause.text))
    ) {
      continue;
    }
    const polarityContext = markerPolarityContext(
      clause,
      occurrence.index,
      occurrence.text.length,
    );
    if (marker.negations.some((pattern) => pattern.test(polarityContext))) continue;
    candidates.push({
      label: marker.label,
      clauseText: clause.text,
      clauseStart: clause.start,
      clauseEnd: clause.end,
      markerStart: occurrence.index,
      markerEnd: occurrence.index + occurrence.text.length,
    });
  }
  return candidates;
}

export function matchAffirmativeConflictMarker(value) {
  return findAffirmativeConflictClauses(value)[0]?.label || null;
}

function nonWhitespaceSegment""",
              flags=re.S,
          )

          replace_once(
              warnings,
              """    const marker = matchAffirmativeConflictMarker(evidence.evidenceText);
    if (!marker) continue;
    const explicitIds = extractCanonicalInputIds(evidence.evidenceText);
    if (explicitIds.some((inputId) => !inputIdResolvesUniquely(inputIndex, inputId))) {
      continue;
    }
    const orderedIds = [
      evidence.ref.inputId,
      ...explicitIds.filter((id) => id !== evidence.ref.inputId),
    ];
    if (new Set(orderedIds).size < 2) continue;
    candidates.push({
      evidencePointer: evidence.ref.raw,
      inputIds: [...new Set(orderedIds)],
      marker,
    });""",
              """    // Preserve the prior fail-closed boundary for the whole exact bullet: a
    // canonical-looking input that is missing or ambiguous suppresses this evidence.
    const allExplicitIds = extractCanonicalInputIds(evidence.evidenceText);
    if (allExplicitIds.some((inputId) => !inputIdResolvesUniquely(inputIndex, inputId))) {
      continue;
    }

    // The semantic relation is clause-local. Do not combine an input named in one
    // sentence/semicolon clause with an unrelated conflict marker in another.
    for (const markerCandidate of findAffirmativeConflictClauses(evidence.evidenceText)) {
      const explicitIds = extractCanonicalInputIds(markerCandidate.clauseText);
      if (explicitIds.some((inputId) => !inputIdResolvesUniquely(inputIndex, inputId))) {
        continue;
      }
      const orderedIds = [
        evidence.ref.inputId,
        ...explicitIds.filter((id) => id !== evidence.ref.inputId),
      ];
      if (new Set(orderedIds).size < 2) continue;
      candidates.push({
        evidencePointer: evidence.ref.raw,
        inputIds: [...new Set(orderedIds)],
        marker: markerCandidate.label,
        clauseStart: markerCandidate.clauseStart,
        markerStart: markerCandidate.markerStart,
      });
      break;
    }""",
          )

          replace_once(
              warnings,
              """  candidates.sort(
    (a, b) =>
      stableCompare(a.evidencePointer, b.evidencePointer) ||
      stableCompare(a.marker, b.marker) ||
      stableCompare(a.inputIds.join('\\0'), b.inputIds.join('\\0')),
  );""",
              """  candidates.sort(
    (a, b) =>
      stableCompare(a.evidencePointer, b.evidencePointer) ||
      a.clauseStart - b.clauseStart ||
      a.markerStart - b.markerStart ||
      stableCompare(a.marker, b.marker) ||
      stableCompare(a.inputIds.join('\\0'), b.inputIds.join('\\0')),
  );""",
          )

          replace_once(
              tests,
              """  analyzeReconciliationWarnings,
  extractCanonicalInputIds,
  matchAffirmativeConflictMarker,""",
              """  analyzeReconciliationWarnings,
  extractCanonicalInputIds,
  findAffirmativeConflictClauses,
  matchAffirmativeConflictMarker,""",
          )

          replace_once(
              tests,
              """    'A와 B가 상충할 수 있다',
    'there may be a conflict',""",
              """    'A와 B가 상충할 수 있다',
    'A와 B가 충돌할지도 모른다',
    'A와 B가 충돌한 것은 아니다',
    'A와 B가 상충한다고 단정할 수 없다',
    'A와 B가 서로 모순이라고 할 수 없다',
    'there may be a conflict',""",
          )

          replace_once(
              tests,
              """    'whether A conflicts with B',
    'this is not a conflict',""",
              """    'whether A conflicts with B',
    'I wonder if A conflicts with B',
    'It is not true that A conflicts with B',
    'this is not a conflict',""",
          )

          replace_once(
              tests,
              """    'This could conflict with B',
    'A can conflict with B',
    'A appears to conflict with B',""",
              """    'This could conflict with B',
    'A would conflict with B',
    'A can conflict with B',
    'A could be incompatible with B',
    'A appears incompatible with B',
    'A appears to conflict with B',""",
          )

          replace_once(
              tests,
              """  assert.equal(
    matchAffirmativeConflictMarker('A could replace B, but B conflicts with C.'),
    'conflicts with',
  );
});

test('canonical input extraction""",
              """  assert.equal(
    matchAffirmativeConflictMarker('A could replace B, but B conflicts with C.'),
    'conflicts with',
  );
  assert.equal(
    matchAffirmativeConflictMarker('A may replace B, but B conflicts with C.'),
    'conflicts with',
  );
  assert.equal(
    matchAffirmativeConflictMarker('A와 B는 충돌할지도 모른다. 그러나 B와 C는 명백히 충돌한다.'),
    '충돌',
  );
});

test('RR-ROUTE-101 marker candidates preserve source-ordered clause metadata', () => {
  const candidates = findAffirmativeConflictClauses(
    `로컬 옵션은 충돌한다. ${OTHER_INPUT_ID} 정책과 상충한다.`,
  );
  assert.deepEqual(candidates.map((candidate) => candidate.label), ['충돌', '상충']);
  assert.equal(candidates[0].clauseText, '로컬 옵션은 충돌한다.');
  assert.equal(candidates[1].clauseText, `${OTHER_INPUT_ID} 정책과 상충한다.`);
  assert.ok(candidates[0].clauseStart < candidates[1].clauseStart);
  assert.ok(candidates[0].clauseEnd <= candidates[1].clauseStart);
});

test('RR-ROUTE-101 couples the marker and explicit input IDs to the same clause', () => {
  for (const evidenceText of [
    `관련 입력은 ${OTHER_INPUT_ID}이다. 화면 내부 옵션 두 개는 서로 충돌한다.`,
    `${OTHER_INPUT_ID}은 현재 정책과 동일하다. 별도의 두 UI 옵션은 양립 불가다.`,
    `${OTHER_INPUT_ID}을 참고한다; 로컬 캐시와 서버 캐시는 서로 모순이다.`,
  ]) {
    assert.equal(routeWarnings({ evidenceText }).length, 0, evidenceText);
  }

  assert.equal(
    routeWarnings({ evidenceText: `기존 ${OTHER_INPUT_ID} 정책과 충돌한다.` }).length,
    1,
  );
  assert.equal(
    routeWarnings({
      evidenceText: `${OTHER_INPUT_ID}과 ${THIRD_INPUT_ID}가 같은 clause에서 서로 충돌한다.`,
      extraArtifacts: [inputArtifact(THIRD_INPUT_ID, ['unique third input'])],
    }).length,
    1,
  );

  const laterValid = routeWarnings({
    evidenceText:
      `${OTHER_INPUT_ID}와 충돌한 것은 아니다. ` +
      `그러나 ${OTHER_INPUT_ID}와 명백히 상충한다.`,
  });
  assert.equal(laterValid.length, 1);
  assert.match(laterValid[0], /marker '상충'/);

  const firstSatisfying = routeWarnings({
    evidenceText: `로컬 옵션은 충돌한다. ${OTHER_INPUT_ID} 정책과 상충한다.`,
  });
  assert.equal(firstSatisfying.length, 1);
  assert.match(firstSatisfying[0], /marker '상충'/);
});

test('canonical input extraction""",
          )

          replace_once(
              integration,
              """    ['- 기존 IN-20260720-figma-001 정책과 충돌하지 않음.'],
    ['- `IN-20260720-figma-001 충돌`은 코드 예시다.'],""",
              """    ['- 기존 IN-20260720-figma-001 정책과 충돌하지 않음.'],
    ['- 관련 입력은 IN-20260720-figma-001이다. 화면 내부 옵션 두 개는 서로 충돌한다.'],
    ['- IN-20260720-figma-001은 현재 정책과 동일하다. 별도 UI 옵션 두 개는 양립 불가다.'],
