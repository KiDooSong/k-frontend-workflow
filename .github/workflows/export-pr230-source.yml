name: Export PR230 source

on:
  push:
    branches:
      - tmp/pr230-workspace-export-20260904

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source
        run: tar --exclude=.git -czf /tmp/pr230-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pr230-source
          path: /tmp/pr230-source.tar.gz
          if-no-files-found: error
          retention-days: 1
