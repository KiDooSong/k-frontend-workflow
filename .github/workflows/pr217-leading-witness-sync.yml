name: pr217-leading-witness-sync

on:
  push:
    branches:
      - codex/issue-202c-reconciliation-warnings

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-202c-reconciliation-warnings
          fetch-depth: 0
      - name: Synchronize dogfood witness metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kit-dev/temp/runs/issue-202-reconciliation-dogfood-001.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('> review correction: 2026-08-05', '> review correction: 2026-08-06'),
              (
                  '> current coordination-boundary/epistemic precision implementation/tests witness: `3de27895de4eadaed64329e115dccc9b40b96c48`\n'
                  '> reviewed implementation HEAD: `3de27895de4eadaed64329e115dccc9b40b96c48` (subsequent evidence-metadata-only commits do not alter analyzer/tests)',
                  '> prior coordination-boundary/epistemic precision implementation/tests witness: `3de27895de4eadaed64329e115dccc9b40b96c48`\n'
                  '> current symmetric leading-coordination/epistemic implementation/tests witness: `9cc8ba3a368a705001c6f15cd81803cb54e477ed`\n'
                  '> reviewed implementation HEAD: `9cc8ba3a368a705001c6f15cd81803cb54e477ed` (subsequent evidence-metadata-only commits do not alter analyzer/tests)',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one witness replacement, got {text.count(old)}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/pr217-leading-witness-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(dogfood): record symmetric coordination witness"
          git push origin "HEAD:codex/issue-202c-reconciliation-warnings"
